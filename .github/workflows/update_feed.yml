name: Auto Update Xperia Feed

on:
  schedule:
    # 7:15, 15:15, 20:15 GMT+7 (00:15, 08:15, 13:15 UTC)
    - cron: '15 0,8,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch and Update Sony Live Feed
        run: |
          python whatsnew/scripts/update_feed.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add whatsnew/
          if git diff --staged --quiet; then
            echo 'No changes detected.'
          else
            git commit -m 'chore(live-feed): auto-update Sony Xperia feed [skip ci]'
            git push
          fi

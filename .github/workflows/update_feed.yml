name: Auto Update Xperia Feed

on:
  schedule:
    # Du phong chay moi 6 tieng phong khi webhook Google bi dung
    - cron: '17 */6 * * *'
  workflow_dispatch:

# Khoa chong chay dong thoi (Race Condition Prevention): tranh 2 workflow chay cung luc gay xung dot git push
concurrency:
  group: xperia-feed-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Fetch and Update Sony Live Feed
        run: |
          python whatsnew/scripts/update_feed.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add whatsnew/
          if git diff --staged --quiet; then
            echo 'No changes detected.'
          else
            git commit -m 'chore(live-feed): auto-update Sony Xperia feed [skip ci]'
            git pull --rebase origin main || true
            git push origin main || (sleep 5 && git pull --rebase origin main && git push origin main)
          fi

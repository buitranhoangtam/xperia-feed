name: Auto Update Xperia Feed

on:
  schedule:
    # Chay moi 2 tieng (phut 25 le tranh hang doi cao diem cua GitHub Actions)
    # Bao gom cac moc: 1h25, 3h25, 5h25, 7h25, 9h25, 11h25, 13h25, 15h25, 17h25, 19h25, 21h25, 23h25 GMT+7
    - cron: '25 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Fetch and Update Sony Live Feed
        run: |
          python whatsnew/scripts/update_feed.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add whatsnew/
          if git diff --staged --quiet; then
            echo 'No changes detected.'
          else
            git commit -m 'chore(live-feed): auto-update Sony Xperia feed [skip ci]'
            git push
          fi

name: Auto Update Xperia Feed

on:
  schedule:
    # 4 moc phut le (7, 23, 37, 53) hoan toan tranh gridlock cua cac bo dem 00, 15, 30, 45, 50 tren GitHub Actions
    # Tan suat moi 15 phut dam bao 96 luot/ngay, khong bao gio bi dut quang du lieu tren repo Public mien phi
    - cron: '7 * * * *'
    - cron: '23 * * * *'
    - cron: '37 * * * *'
    - cron: '53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Fetch and Update Sony Live Feed
        run: |
          python whatsnew/scripts/update_feed.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add whatsnew/
          if git diff --staged --quiet; then
            echo 'No changes detected.'
          else
            git commit -m 'chore(live-feed): auto-update Sony Xperia feed [skip ci]'
            git push
          fi
